<style>
/* Layout: full-height app. Dot-grid canvas with draggable code cards laid out in call-depth columns; story panel on the right (bottom sheet on phones). Dark-first. */
:root{

  --fg:#e7ebe9; --muted:#8b9590; --faint:#5d6662; --dot:#2a2f2d;

  --tk-k:#c792ea; --tk-s:#9fd8a8; --tk-n:#f2b57a; --tk-f:#7fb8f5; --tk-t:#e7c77b; --tk-c:#5d6662;

}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){

  --fg:#18201c; --muted:#5f6a65; --faint:#97a19c; --dot:#d3dad7;
  --accent:#16955e; --accent-soft:rgba(22,149,94,.10); --edge:#b4bdb9;
  --add-bg:rgba(22,149,94,.09); --add-fg:#12804f; --del-bg:rgba(214,55,55,.08); --del-fg:#c33a3a;
  --new:#16955e; --changed:#b7801a; --context:#8a948f; --warn:#b7801a;
  --tk-k:#8a3fc4; --tk-s:#2c7a3f; --tk-n:#b25f12; --tk-f:#1f63b8; --tk-t:#8a6510; --tk-c:#97a19c;
  --shadow:0 1px 2px rgba(20,30,25,.06), 0 10px 24px -14px rgba(20,30,25,.25);
  color-scheme:light;
}}
:root[data-theme="light"]{
  --bg:#f5f7f6; --panel:#ffffff; --panel-2:#f3f5f4; --border:#dde3e0; --border-strong:#c6cecb;
  --fg:#18201c; --muted:#5f6a65; --faint:#97a19c; --dot:#d3dad7;

  --new:#16955e; --changed:#b7801a; --context:#8a948f; --warn:#b7801a;

  --shadow:0 1px 2px rgba(20,30,25,.06), 0 10px 24px -14px rgba(20,30,25,.25);

}

html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 var(--sans);overflow:hidden}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
code{font-family:var(--mono);font-size:.88em;background:var(--panel-2);border:1px solid var(--border);padding:1px 4px;border-radius:4px;overflow-wrap:anywhere}

.app{display:grid;grid-template-columns:minmax(0,1fr) 400px;height:100%}
.app{overflow:hidden}
.app.slide{transition:grid-template-columns .3s cubic-bezier(.3,.7,.2,1),grid-template-rows .3s cubic-bezier(.3,.7,.2,1)}
.app.collapsed{grid-template-columns:minmax(0,1fr) 0}
.app .panel{width:400px;justify-self:start;transition:visibility 0s}
.app.collapsed .panel{visibility:hidden}
.app.slide.collapsed .panel{transition:visibility 0s .3s}

/* ---------- canvas ---------- */
.canvas{position:relative;overflow:hidden;touch-action:none;cursor:grab;
  background-color:var(--bg);background-image:radial-gradient(circle, var(--dot) 1.1px, transparent 1.3px);background-size:20px 20px}
.canvas.panning{cursor:grabbing}
.canvas,.canvas *{user-select:none;-webkit-user-select:none}  /* dragging on the canvas or a container must never select text */
.canvas .row .code{user-select:text;-webkit-user-select:text;cursor:text}  /* ...but code inside a card stays copyable */
.world{position:absolute;left:0;top:0;transform-origin:0 0}
.canvas.anim .world{transition:transform .5s cubic-bezier(.2,.75,.2,1)}
.canvas.anim{transition:background-position .5s cubic-bezier(.2,.75,.2,1), background-size .5s cubic-bezier(.2,.75,.2,1)}
svg.edges{position:absolute;left:0;top:0;width:1px;height:1px;overflow:visible;pointer-events:none}
.edge{fill:none;stroke:var(--edge);stroke-width:1.5;transition:opacity .25s, stroke .25s}
.edge.soft{stroke-dasharray:3 4}
.edge.active{stroke:var(--accent);stroke-width:2;stroke-dasharray:6 5;animation:flow 1s linear infinite}
.edge.dim{opacity:.14}
@keyframes flow{to{stroke-dashoffset:-11}}
.edge-end{fill:var(--edge)} .edge-end.active{fill:var(--accent)} .edge-end.dim{opacity:.14}
.edge-label{position:absolute;transform:translate(-50%,-50%);pointer-events:none;white-space:nowrap;
  font:500 10.5px/1 var(--mono);padding:4px 6px;border-radius:4px;border:1px solid var(--border);
  background:var(--panel);color:var(--muted);transition:opacity .25s}
.edge-label.active{color:var(--accent);border-color:var(--accent)}
.edge-label.dim{opacity:0}

/* ---------- project groups ---------- */
.group{position:absolute;left:0;top:0;border:1.5px solid var(--border-strong);border-radius:14px;background:color-mix(in srgb, var(--fg) 4%, transparent);
  pointer-events:auto;transition:opacity .25s}
.group.dim{opacity:.45}
.group-title{position:absolute;left:0;top:0;right:0;height:46px;padding:15px 18px 0;box-sizing:border-box;display:flex;align-items:baseline;gap:10px;
  font:600 15px/1.2 var(--sans);color:var(--fg);user-select:none;cursor:grab;overflow:hidden;white-space:nowrap;border-radius:14px 14px 0 0}
.group-title:active{cursor:grabbing}
.group-title small{font:500 11px/1 var(--mono);color:var(--muted)}

/* ---------- nodes ---------- */
.node{position:absolute;min-width:280px;max-width:640px;background:var(--panel);border:1px solid var(--border);
  border-radius:8px;box-shadow:var(--shadow);font:12px/1 var(--mono);transition:opacity .25s, border-color .25s, box-shadow .25s}
.node.context{border-style:dashed}
.node.dim{opacity:.3}
.node.focus{border-color:var(--border-strong)}
.node.primary{border-color:var(--accent);border-style:solid;box-shadow:0 0 0 3px var(--accent-soft), var(--shadow)}
.node.dragging{box-shadow:0 0 0 1px var(--border-strong), 0 24px 40px -16px rgba(0,0,0,.55);transition:none}
.node.pulse{animation:pulse .9s ease-out}
@keyframes pulse{0%{box-shadow:0 0 0 0 var(--accent)}100%{box-shadow:0 0 0 14px transparent}}
.node-head{display:flex;align-items:center;gap:10px;padding:9px 12px;border-bottom:1px solid var(--border);
  background:var(--panel-2);border-radius:8px 8px 0 0;cursor:grab;user-select:none;font-family:var(--sans)}
.node-head:active{cursor:grabbing}
.node-title{display:flex;flex-direction:column;gap:3px;min-width:0;flex:1}
.node-sym{font-weight:600;font-size:13px;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.node-path{font:11px/1.2 var(--mono);color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.node-path b{color:var(--fg);font-weight:500}
.expand{flex:none;width:22px;height:22px;display:grid;place-items:center;padding:0;border:1px solid var(--border);border-radius:5px;
  background:transparent;color:var(--muted);cursor:pointer}
.expand:hover{color:var(--fg);border-color:var(--border-strong)}
.expand svg{width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.node.expanded{max-width:none;z-index:50}
.node.expanded .row .code{overflow:visible;text-overflow:clip}
.badge{display:inline-flex;align-items:center;font:500 10px/1 var(--mono);text-transform:uppercase;letter-spacing:.06em;
  padding:4px 6px;border-radius:4px;border:1px solid currentColor;flex:none}
.badge.new{color:var(--new)} .badge.changed{color:var(--changed)} .badge.context{color:var(--context)}
.stat{font:500 11px/1 var(--mono);flex:none;display:flex;gap:6px}
.stat .a{color:var(--add-fg)} .stat .d{color:var(--del-fg)}
.entry{display:flex;align-items:center;gap:6px;padding:6px 12px;border-bottom:1px solid var(--border);font:500 11px/1.2 var(--mono);color:var(--accent)}
.entry::before{content:"";width:0;height:0;border-left:6px solid currentColor;border-top:4px solid transparent;border-bottom:4px solid transparent}
.entry.test{color:var(--muted)}
.step-pin{position:absolute;top:-11px;left:-11px;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;
  background:var(--bg);border:1px solid var(--border-strong);font:600 11px/1 var(--sans);color:var(--muted);font-variant-numeric:tabular-nums}
.node.primary .step-pin{background:var(--accent);border-color:var(--accent);color:var(--bg)}
.target-handle{position:absolute;width:9px;height:9px;border-radius:50%;background:var(--panel);border:1.5px solid var(--edge);top:19px;left:-5.5px}
.target-handle.r{left:auto;right:-5.5px}

.rows{padding:4px 0 6px}
.row{display:flex;align-items:center;height:21px;white-space:pre;position:relative;padding-right:14px}
.row .ln{width:40px;flex:none;text-align:right;padding-right:10px;color:var(--faint);font-variant-numeric:tabular-nums}
.row .sg{width:14px;flex:none;color:var(--faint)}
.row .code{min-width:0;overflow:hidden;text-overflow:ellipsis}
.row.add{background:var(--add-bg)} .row.add .sg{color:var(--add-fg)}
.row.del{background:var(--del-bg)} .row.del .sg{color:var(--del-fg)} .row.del .code{opacity:.75;text-decoration:line-through;text-decoration-color:var(--del-fg)}
.row.fold{color:var(--faint);font-style:italic;height:19px}
.row.fold .code{border-top:1px dashed var(--border);border-bottom:1px dashed var(--border);padding:1px 8px;margin-left:-4px}
.row.anchor::after{content:"";position:absolute;right:-5.5px;top:50%;width:9px;height:9px;margin-top:-4.5px;border-radius:50%;
  background:var(--panel);border:1.5px solid var(--edge)}
.row.anchor.l::after{right:auto;left:-5.5px}
.row.anchor.hot::after{border-color:var(--accent);background:var(--accent)}
.row.anchor.hot{box-shadow:inset 2px 0 0 var(--accent)}
.tk-k{color:var(--tk-k)} .tk-s{color:var(--tk-s)} .tk-n{color:var(--tk-n)} .tk-f{color:var(--tk-f)} .tk-t{color:var(--tk-t)} .tk-c{color:var(--tk-c);font-style:italic}

/* ---------- canvas chrome ---------- */
.legend{position:absolute;top:14px;left:14px;display:flex;gap:14px;flex-wrap:wrap;padding:8px 12px;border:1px solid var(--border);
  border-radius:8px;background:var(--panel);font:500 11px/1 var(--mono);color:var(--muted);z-index:5}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:8px;height:8px;border-radius:2px;display:block}
.legend i.ctx{background:transparent;border:1px dashed var(--context)}
.controls{position:absolute;left:14px;bottom:14px;display:flex;flex-direction:column;border:1px solid var(--border);border-radius:8px;
  background:var(--panel);overflow:hidden;z-index:5}
.controls button{width:34px;height:32px;border:0;background:none;cursor:pointer;display:grid;place-items:center;color:var(--muted)}
.controls button+button{border-top:1px solid var(--border)}
.controls button:hover{color:var(--fg);background:var(--panel-2)}
.controls button[aria-pressed="false"]{color:var(--faint)}
.controls svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.hint{position:absolute;right:14px;bottom:14px;font:11px/1.4 var(--mono);color:var(--muted);z-index:5;text-align:right;pointer-events:none;
  background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:6px 10px}
.zoom-read{position:absolute;left:58px;bottom:14px;font:500 11px/32px var(--mono);color:var(--faint);z-index:5;font-variant-numeric:tabular-nums}

.panelbtn{position:absolute;top:14px;right:14px;width:34px;height:32px;border:1px solid var(--border);border-radius:8px;background:var(--panel);
  color:var(--muted);cursor:pointer;display:grid;place-items:center;z-index:5}
.panelbtn:hover{color:var(--fg);background:var(--panel-2)}
.panelbtn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.app:not(.collapsed) .panelbtn .open,.app.collapsed .panelbtn .close{display:none}

/* ---------- panel ---------- */
.panel{border-left:1px solid var(--border);background:var(--panel);display:flex;flex-direction:column;min-height:0;min-width:0}
.pr{padding:18px 20px 16px;border-bottom:1px solid var(--border)}
.pr-repo{font:12px/1.4 var(--mono);color:var(--muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pr-repo .branch{color:var(--fg)}
.pr h1{font-size:18px;line-height:1.3;font-weight:600;margin:10px 0 10px;text-wrap:balance;letter-spacing:-.01em}
.pr-meta{display:flex;gap:14px;flex-wrap:wrap;font:12px/1 var(--mono);color:var(--muted)}
.pr-meta .a{color:var(--add-fg)} .pr-meta .d{color:var(--del-fg)}
.loadbtn{margin-left:auto;border:1px solid var(--border-strong);background:var(--panel-2);border-radius:6px;padding:4px 8px;font:11px/1 var(--mono);cursor:pointer;color:var(--muted)}
.loadbtn:hover{color:var(--fg)}

.scroll{flex:1;overflow-y:auto;min-height:0}
.step{padding:20px 20px 18px;border-bottom:1px solid var(--border)}
.eyebrow{font:500 11px/1 var(--mono);text-transform:uppercase;letter-spacing:.08em;color:var(--accent)}
.step h2{font-size:16px;line-height:1.35;font-weight:600;margin:10px 0 10px;text-wrap:balance;overflow-wrap:anywhere}
.step p{margin:0 0 8px;color:var(--muted);max-width:65ch}
.step h3{font:500 11px/1 var(--mono);text-transform:uppercase;letter-spacing:.08em;color:var(--faint);margin:20px 0 10px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--border);background:var(--panel-2);border-radius:6px;
  padding:6px 9px;font:12px/1.2 var(--mono);cursor:pointer;color:var(--fg);max-width:100%;text-align:left}
.chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip:hover{border-color:var(--border-strong)}
.chip i{width:7px;height:7px;border-radius:2px;display:block;flex:none}

.checks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}

.checks li::before{content:"!";width:14px;height:14px;margin-top:3px;border-radius:4px;border:1.5px solid var(--warn);color:var(--warn);
  font:700 9px/11px var(--sans);text-align:center}
.checks li.ok::before{content:"✓";border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.warnings{margin:0;padding:0 0 0 18px;color:var(--warn);font-size:12.5px}

.steplist{list-style:none;margin:0;padding:12px 12px 16px;display:flex;flex-direction:column;gap:2px}
.steplist button{width:100%;display:grid;grid-template-columns:24px 1fr auto;gap:10px;align-items:start;text-align:left;
  background:none;border:0;border-radius:6px;padding:8px;cursor:pointer;color:var(--muted);font-size:13px;line-height:1.4}
.steplist button:hover{background:var(--panel-2);color:var(--fg)}
.steplist .n{width:22px;height:22px;border-radius:50%;border:1px solid var(--border-strong);display:grid;place-items:center;
  font:600 11px/1 var(--sans);font-variant-numeric:tabular-nums}
.steplist .flags{font:500 11px/22px var(--mono);color:var(--warn);font-variant-numeric:tabular-nums}
.steplist .t{overflow-wrap:anywhere}
.steplist button[aria-current="step"]{background:var(--accent-soft);color:var(--fg)}
.steplist button[aria-current="step"] .n{background:var(--accent);border-color:var(--accent);color:var(--bg)}

.nav{display:flex;gap:8px;padding:12px 20px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--border)}
.nav button{flex:1;height:36px;border-radius:6px;border:1px solid var(--border-strong);background:var(--panel-2);cursor:pointer;font-weight:500}
.nav button.primary{background:var(--accent);border-color:var(--accent);color:var(--bg)}
.nav button:disabled{opacity:.4;cursor:default}
.nav kbd{font:11px var(--mono);opacity:.6;margin-left:6px}

.empty{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);text-align:center;padding:24px}

@media (max-width:820px){
  .app{grid-template-columns:minmax(0,1fr);grid-template-rows:55% 45%}
  .app.collapsed{grid-template-columns:minmax(0,1fr);grid-template-rows:100% 0}
  .app .panel{width:auto}
  .panelbtn{top:auto;bottom:14px}

}
@media (prefers-reduced-motion: reduce){
  .canvas.anim .world,.canvas.anim{transition:none}
  .edge.active{animation:none}
  .node.pulse{animation:none}
}
</style>

function hl(src){
  const re = /(\/\/.*$)|(\$?@?"(?:[^"\\]|\\.)*"|'(?:[^'\\]|\\.)')|(\b\d+(?:\.\d+)?[mMdDfFLuU]?\b)|([A-Za-z_][\w]*)/g;
  let out = "", last = 0, m;
  while ((m = re.exec(src))){
    out += esc(src.slice(last, m.index));
    const t = m[0];
    if (m[1]) out += `<span class="tk-c">${esc(t)}</span>`;
    else if (m[2]) out += `<span class="tk-s">${esc(t)}</span>`;
    else if (m[3]) out += `<span class="tk-n">${t}</span>`;
    else if (KW.has(t)) out += `<span class="tk-k">${t}</span>`;
    else if (src[re.lastIndex] === "(") out += `<span class="tk-f">${t}</span>`;
    else if (/^[A-Z]/.test(t)) out += `<span class="tk-t">${t}</span>`;
    else out += t;
    last = re.lastIndex;
  }
  return out + esc(src.slice(last));
}

function buildGroups(){
  const names = [...new Set(NODES.map(n => n.project || ""))];
  const first = {}; NODES.forEach(n => { const p = n.project || ""; first[p] = Math.min(first[p] ?? Infinity, n.layer * 1e4 + n.order); });
  const testOnly = p => NODES.filter(n => (n.project || "") === p).every(n => n.test);
  names.sort((a,b) => testOnly(a) - testOnly(b) || first[a] - first[b]);
  GROUPS = names.map(name => {
    const el = document.createElement("div"); el.className = "group";
    el.innerHTML = name ? `<div class="group-title">${esc(name)}<small></small></div>` : "";
    world.prepend(el);
    return {name, el, ids:NODES.filter(n => (n.project || "") === name).map(n => n.id), x:0, y:0, w:0, h:0};
  });
}
const groupOf = id => GROUPS.find(g => g.ids.includes(id));
function layout(){
  const GAPX = 100, GAPY = 32;
  home = {}; let gy = 0;
  for (const g of GROUPS){
    const members = NODES.filter(n => g.ids.includes(n.id));
    const layers = [...new Set(members.map(n => n.layer))].sort((a,b) => a-b);
    const head = g.name ? GHEAD : GPAD;
    let x = 0, maxB = 0;
    for (const L of layers){
      const col = members.filter(n => n.layer === L && visible(n.id)).sort((a,b) => a.order - b.order);
      const w = Math.max(0, ...col.map(n => nodeEls[n.id].offsetWidth));
      let bottom = -Infinity;
      for (const n of col){
        const ins = EDGES.map(e => ({e, s:parse(e.from)})).filter(({e,s}) => parse(e.to).id === n.id && home[s.id] && g.ids.includes(s.id) && byId[s.id].layer < L);
        const want = ins.length ? ins.reduce((a,{e,s}) => a + home[s.id].y - gy - head + rowY(s.id, s.line), 0) / ins.length - 22 : 0;
        const y = bottom === -Infinity ? Math.max(0, want) : Math.max(want, bottom + GAPY);
        home[n.id] = {x: GPAD + x, y: gy + head + y};
        bottom = y + nodeEls[n.id].offsetHeight; maxB = Math.max(maxB, bottom);
      }
      if (col.length) x += w + GAPX;
    }
    g.x = 0; g.y = gy; g.w = Math.max(320, x - GAPX + GPAD * 2); g.h = head + maxB + GPAD;
    g.vis = members.some(n => visible(n.id));
    if (g.vis) gy += g.h + GGAP;
  }
  for (const n of NODES) if (!home[n.id]) home[n.id] = {x:0, y:0};
}
// A card that grew (expand) must still fit its group; later groups slide down to make room.
function growGroup(id){
  const g = groupOf(id), el = nodeEls[id]; if (!g) return;
  const p = pos[id], r = p.x + el.offsetWidth + GPAD - g.x, b = p.y + el.offsetHeight + GPAD - g.y;
  const dw = Math.max(0, r - g.w), dh = Math.max(0, b - g.h);
  g.w += dw; g.h += dh;
  if (dh) for (const o of GROUPS) if (o !== g && o.vis && o.y > g.y){ o.y += dh; o.ids.forEach(i => pos[i].y += dh); }
}
function clampToGroup(id){
  const g = groupOf(id), el = nodeEls[id], p = pos[id]; if (!g) return;
  const top = g.y + (g.name ? GHEAD : GPAD);
  p.x = Math.min(Math.max(p.x, g.x + GPAD), Math.max(g.x + GPAD, g.x + g.w - GPAD - el.offsetWidth));
  p.y = Math.min(Math.max(p.y, top), Math.max(top, g.y + g.h - GPAD - el.offsetHeight));
}

/* ---------- drawing ---------- */
function visible(id){ return showContext || byId[id].kind !== "context"; }
function placeGroups(){
  for (const g of GROUPS){
    g.el.hidden = !g.vis || !g.name;
    g.el.style.transform = `translate(${g.x}px,${g.y}px)`; g.el.style.width = g.w + "px"; g.el.style.height = g.h + "px";
    const c = g.ids.filter(visible).length; const sm = g.el.querySelector("small"); if (sm) sm.textContent = `${c} card${c===1?"":"s"}`;
  }
}
function placeNodes(){ placeGroups(); for (const id in nodeEls){ nodeEls[id].style.transform = `translate(${pos[id].x}px,${pos[id].y}px)`; nodeEls[id].hidden = !visible(id); } }
function drawEdges(){
  EDGES.forEach((e,i) => {
    const s = parse(e.from), t = parse(e.to);
    const show = visible(s.id) && visible(t.id);
    pathEls[i].style.display = endEls[i].style.display = show ? "" : "none"; labelEls[i].hidden = !show;
    if (!show) return;
    const se = nodeEls[s.id], te = nodeEls[t.id], sw = se.offsetWidth, tw = te.offsetWidth;
    const sx0 = pos[s.id].x, tx0 = pos[t.id].x;
    let sSide, tSide;
    if (tx0 >= sx0 + sw * .6) { sSide = 1; tSide = -1; }
    else if (tx0 + tw <= sx0 + sw * .4) { sSide = -1; tSide = 1; }
    else { sSide = 1; tSide = 1; }
    const sx = sSide > 0 ? sx0 + sw : sx0, sy = pos[s.id].y + rowY(s.id, s.line);
    const tx = tSide > 0 ? tx0 + tw : tx0, ty = pos[t.id].y + rowY(t.id, t.line);
    const c = Math.max(60, Math.abs(tx - sx) * .45);
    const c1x = sx + sSide * c, c2x = tx + tSide * c;
    pathEls[i].setAttribute("d", `M${sx},${sy} C${c1x},${sy} ${c2x},${ty} ${tx},${ty}`);
    endEls[i].setAttribute("cx", tx); endEls[i].setAttribute("cy", ty);
    labelEls[i].style.left = (.125*sx + .375*c1x + .375*c2x + .125*tx) + "px";
    labelEls[i].style.top = (.5*sy + .5*ty) + "px";
    const row = s.line && se.querySelector(`[data-line="${s.line}"]`);
    if (row) row.classList.toggle("l", sSide < 0);
    te.querySelector(".target-handle").classList.toggle("r", tSide > 0 && !t.line);
  });
}
let raf = 0;
function draw(){ if (raf) return; raf = requestAnimationFrame(() => { raf = 0; placeNodes(); drawEdges(); }); }
function drawNow(){ placeNodes(); drawEdges(); }
function applyCam(){
  world.style.transform = `translate(${cam.x}px,${cam.y}px) scale(${cam.k})`;
  canvas.style.backgroundSize = `${20*cam.k}px ${20*cam.k}px`;
  canvas.style.backgroundPosition = `${cam.x}px ${cam.y}px`;
  $("#zread").textContent = Math.round(cam.k*100) + "%";
}
function animate(fn){
  if (reduce) { fn(); return; }
  canvas.classList.add("anim"); fn();
  clearTimeout(animate.t); animate.t = setTimeout(() => canvas.classList.remove("anim"), 520);
}
function currentIds(){ return STEPS[active] ? STEPS[active].nodes : NODES.map(n=>n.id); }
function fitCam(ids){
  ids = ids.filter(visible);
  if (!ids.length) ids = NODES.map(n=>n.id).filter(visible);
  if (!ids.length) return null;
  let x0=Infinity,y0=Infinity,x1=-Infinity,y1=-Infinity;
  ids.forEach(id => { const el = nodeEls[id];
    x0 = Math.min(x0,pos[id].x); y0 = Math.min(y0,pos[id].y);
    x1 = Math.max(x1,pos[id].x+el.offsetWidth); y1 = Math.max(y1,pos[id].y+el.offsetHeight); });
  const r = canvas.getBoundingClientRect(), pad = r.width < 500 ? 24 : 60;
  let k = Math.max(.12, Math.min(1.05, (r.width-pad*2)/(x1-x0), (r.height-pad*2-40)/(y1-y0)));
  let cx = (x0+x1)/2, cy = (y0+y1)/2;
  // A step should stay readable: if its cards don't fit, keep the zoom legible and centre the main card.
  const st = STEPS[active], min = r.width < 500 ? .42 : .55;
  if (st && ids.length > 1 && k < min && visible(st.primary)) {
    k = min; const p = pos[st.primary], el = nodeEls[st.primary];
    cx = p.x + el.offsetWidth/2; cy = Math.max(p.y + el.offsetHeight/2, y0 + (r.height/2 - pad)/k);
  }
  return { k, x: r.width/2 - cx*k, y: r.height/2 - cy*k + 18 };
}
function fit(ids, anim = true){
  const c = fitCam(ids); if (!c) return;
  const go = () => { cam.k = c.k; cam.x = c.x; cam.y = c.y; applyCam(); };
  anim ? animate(go) : go();
}
function zoomAt(cx, cy, k){
  k = Math.max(.12, Math.min(2, k));
  const wx = (cx-cam.x)/cam.k, wy = (cy-cam.y)/cam.k;
  cam.k = k; cam.x = cx - wx*k; cam.y = cy - wy*k; applyCam();
}

/* ---------- story ---------- */
function buildStepList(){
  $("#steplist").innerHTML = `<li><button data-i="-1"><span class="n">·</span><span class="t">Overview</span><span></span></button></li>` +
    STEPS.map((s,i) => { const f = s.checks.filter(c => !c.ok).length;
      return `<li><button data-i="${i}"><span class="n">${i+1}</span><span class="t">${esc(s.title)}</span><span class="flags" title="${f} things to check">${f?`${f} !`:""}</span></button></li>`; }).join("");
}
$("#steplist").addEventListener("click", e => { const b = e.target.closest("button"); if (b) setStep(+b.dataset.i); });

function chipFor(id){
  const n = byId[id];
  return `<button class="chip" data-node="${id}"><i class="${n.kind==="context"?"ctx":""}" style="${n.kind!=="context"?`background:var(--${n.kind})`:""}"></i><span>${esc(n.sym)}</span></button>`;
}
function setStep(i, anim = true, refit = true){
  active = i;
  const st = STEPS[i], box = $("#step");
  if (!st){
    const changed = NODES.filter(n => n.kind !== "context");
    box.innerHTML = `<div class="eyebrow">Overview</div><h2>${esc(D.pr.title)}</h2>
      ${(D.overview||[]).map(p => `<p>${md(p)}</p>`).join("")}
      ${D.warnings?.length ? `<h3>Analysis notes</h3><ul class="warnings">${D.warnings.map(w=>`<li>${md(w)}</li>`).join("")}</ul>` : ""}
      <h3>Changed code</h3><div class="chips">${changed.map(n=>chipFor(n.id)).join("")}</div>
      <h3>Generated</h3><p><code>${esc(D.pr.base)}</code> → <code>${esc(D.pr.head)}</code> · ${esc(D.generator)} · ${esc(D.pr.analysis)} analysis</p>`;
  } else {
    box.innerHTML = `<div class="eyebrow">Step ${i+1} of ${STEPS.length}</div><h2>${md(st.title)}</h2>${st.body.map(p => `<p>${md(p)}</p>`).join("")}
      <h3>Cards in this step</h3><div class="chips">${st.nodes.map(chipFor).join("")}</div>
      ${st.checks.length ? `<h3>Check this</h3><ul class="checks">${st.checks.map(c=>`<li class="${c.ok?"ok":""}"><span>${md(c.text)}</span></li>`).join("")}</ul>` : ""}`;
  }
  $("#steplist").querySelectorAll("button").forEach(b => {
    if (+b.dataset.i === i) b.setAttribute("aria-current","step"); else b.removeAttribute("aria-current");
  });
  $("#prev").disabled = i < 0;
  $("#next").disabled = i >= STEPS.length - 1;
  $("#next").firstChild.textContent = i < 0 ? "Start walkthrough" : "Next";
  const set = st ? new Set(st.nodes) : null;
  for (const id in nodeEls){
    const el = nodeEls[id];
    el.classList.toggle("dim", !!set && !set.has(id));
    el.classList.toggle("focus", !!set && set.has(id));
    el.classList.toggle("primary", !!st && st.primary === id);
  }
  for (const g of GROUPS) g.el.classList.toggle("dim", !!set && !g.ids.some(i => set.has(i)));
  world.querySelectorAll(".row.anchor.hot").forEach(r => r.classList.remove("hot"));
  EDGES.forEach((e,k) => {
    const s = parse(e.from), t = parse(e.to);
    const on = !!set && set.has(s.id) && set.has(t.id);
    const off = !!set && !on;
    for (const el of [pathEls[k], endEls[k], labelEls[k]]) { el.classList.toggle("active", on); el.classList.toggle("dim", off); }
    if (on && s.line) nodeEls[s.id].querySelector(`[data-line="${s.line}"]`)?.classList.add("hot");
  });
  $("#scroll").scrollTop = 0;
  if (refit) fit(currentIds(), anim);
}
$("#step").addEventListener("click", e => {
  const c = e.target.closest(".chip"); if (!c) return;
  const id = c.dataset.node;
  if (!visible(id)) { showContext = true; $("#ctx").setAttribute("aria-pressed","true"); drawNow(); }
  fit([id]);
  const el = nodeEls[id]; el.classList.remove("pulse"); void el.offsetWidth; el.classList.add("pulse");
});
$("#prev").onclick = () => setStep(Math.max(-1, active-1));
$("#next").onclick = () => setStep(Math.min(STEPS.length-1, active+1));
addEventListener("keydown", e => {
  if (e.target.closest("input,textarea")) return;
  if (e.key === "ArrowRight") setStep(Math.min(STEPS.length-1, active+1));
  else if (e.key === "ArrowLeft") setStep(Math.max(-1, active-1));
  else if (e.key === "Escape" && active >= 0) setStep(-1, true, false);
  else if (e.key === "f" || e.key === "F") fit(currentIds());
  else if ((e.key === "s" || e.key === "S") && !e.metaKey && !e.ctrlKey && !e.altKey) togglePanel();
});

/* ---------- story panel toggle ---------- */
function togglePanel(collapse = !$(".app").classList.contains("collapsed"), slide = true){
  const app = $(".app");
  // Only refit when the view was already the fitted one; a zoomed-in or panned view is left alone.
  const f = D && fitCam(currentIds()), refit = togglePanel.pending || !!f && Math.abs(f.k-cam.k) < .01 && Math.abs(f.x-cam.x) < 2 && Math.abs(f.y-cam.y) < 2;
  app.classList.toggle("slide", slide && !reduce);
  app.classList.toggle("collapsed", collapse);
  const b = $("#panelbtn");
  b.title = (collapse ? "Show" : "Hide") + " story panel (S)";
  b.setAttribute("aria-label", (collapse ? "Show" : "Hide") + " story panel");
  b.setAttribute("aria-expanded", String(!collapse));
  try { localStorage.setItem("reviewgraph.panel", collapse ? "0" : "1"); } catch {}
  clearTimeout(togglePanel.t); togglePanel.pending = false;
  if (refit) {
    togglePanel.pending = true;
    togglePanel.t = setTimeout(() => { togglePanel.pending = false; fit(currentIds(), slide && !reduce); }, slide && !reduce ? 300 : 0);
  }
}
$("#panelbtn").onclick = () => togglePanel();

/* ---------- controls ---------- */
const center = () => { const r = canvas.getBoundingClientRect(); return [r.width/2, r.height/2]; };
$("#zin").onclick = () => animate(() => zoomAt(...center(), cam.k*1.25));
$("#zout").onclick = () => animate(() => zoomAt(...center(), cam.k/1.25));
$("#zfit").onclick = () => fit(currentIds());
$("#relayout").onclick = () => { layout(); pos = structuredClone(home); drawNow(); fit(NODES.map(n => n.id)); };
$("#ctx").onclick = e => {
  showContext = !showContext;
  e.currentTarget.setAttribute("aria-pressed", String(showContext));
  e.currentTarget.title = showContext ? "Hide context cards" : "Show context cards";
  layout(); pos = structuredClone(home); drawNow(); fit(currentIds());
};
$("#loadbtn").onclick = () => $("#file").click();
$("#file").onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  try { load(JSON.parse(await f.text())); }
  catch (err) { $("#step").innerHTML = `<div class="eyebrow">Could not open file</div><p>${esc(f.name)} is not a reviewgraph JSON file: ${esc(err.message)}</p>`; }
  e.target.value = "";
};

/* ---------- pointer: drag cards, pan, pinch ---------- */
const pts = new Map(); let mode = null;
canvas.addEventListener("pointerdown", e => {
  if (e.target.closest(".controls,.legend,.expand,.panelbtn")) return;
  pts.set(e.pointerId, {x:e.clientX, y:e.clientY});
  if (pts.size === 2){
    const [a,b] = [...pts.values()];
    if (mode && mode.type === "node") nodeEls[mode.id].classList.remove("dragging");
    mode = {type:"pinch", d:Math.hypot(a.x-b.x,a.y-b.y), k:cam.k};
    canvas.setPointerCapture(e.pointerId);
    return;
  }
  const gt = e.target.closest(".group-title");
  if (gt){
    const g = GROUPS.find(x => x.el === gt.parentElement);
    mode = {type:"group", g, sx:e.clientX, sy:e.clientY, ox:g.x, oy:g.y, from:g.ids.map(id => [id, pos[id].x, pos[id].y]), moved:false};
    canvas.setPointerCapture(e.pointerId);
    return;
  }
  const head = e.target.closest(".node-head"), node = e.target.closest(".node");
  if (head){
    const id = node.dataset.id;
    mode = {type:"node", id, sx:e.clientX, sy:e.clientY, ox:pos[id].x, oy:pos[id].y, moved:false};
    node.style.zIndex = ++z; node.classList.add("dragging");
  } else if (node){
    mode = {type:"press", id:node.dataset.id, sx:e.clientX, sy:e.clientY, moved:false};
    return;
  } else {
    mode = {type:"pan", sx:e.clientX, sy:e.clientY, ox:cam.x, oy:cam.y};
    canvas.classList.add("panning");
  }
  canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener("pointermove", e => {
  if (!pts.has(e.pointerId) || !mode) return;
  pts.set(e.pointerId, {x:e.clientX, y:e.clientY});
  if (mode.type === "pinch" && pts.size === 2){
    const [a,b] = [...pts.values()], r = canvas.getBoundingClientRect();
    zoomAt((a.x+b.x)/2 - r.left, (a.y+b.y)/2 - r.top, mode.k * Math.hypot(a.x-b.x,a.y-b.y) / mode.d);
    return;
  }
  const dx = e.clientX - mode.sx, dy = e.clientY - mode.sy;
  if (Math.abs(dx)+Math.abs(dy) > 4) mode.moved = true;
  if (mode.type === "node"){ pos[mode.id].x = mode.ox + dx/cam.k; pos[mode.id].y = mode.oy + dy/cam.k; clampToGroup(mode.id); draw(); }
  else if (mode.type === "group"){
    const gx = dx/cam.k, gy = dy/cam.k;
    mode.g.x = mode.ox + gx; mode.g.y = mode.oy + gy;
    for (const [id,x,y] of mode.from){ pos[id].x = x + gx; pos[id].y = y + gy; }
    draw();
  }
  else if (mode.type === "pan"){ cam.x = mode.ox + dx; cam.y = mode.oy + dy; applyCam(); }
});
function end(e){
  if (!pts.has(e.pointerId)) return;
  pts.delete(e.pointerId);
  if (mode && (mode.type === "node" || mode.type === "press") && !mode.moved && pts.size === 0){
    const i = stepOf[mode.id];
    if (i !== undefined && i !== active) setStep(i);
  }
  if (mode && mode.type === "pan" && !mode.moved && pts.size === 0 && e.type === "pointerup" && active >= 0) setStep(-1, true, false);
  if (mode && mode.type === "node") nodeEls[mode.id].classList.remove("dragging");
  if (pts.size === 0){ mode = null; canvas.classList.remove("panning"); }
}
canvas.addEventListener("click", e => {
  const b = e.target.closest(".expand"); if (!b) return;
  const el = b.closest(".node"), on = el.classList.toggle("expanded");
  b.setAttribute("aria-pressed", on); b.title = on ? "Collapse card" : "Expand to show full lines"; b.setAttribute("aria-label", b.title);
  if (on) el.style.zIndex = ++z;
  growGroup(el.dataset.id); clampToGroup(el.dataset.id);
  drawNow();
});
canvas.addEventListener("pointerup", end);
canvas.addEventListener("pointercancel", end);
canvas.addEventListener("wheel", e => {
  e.preventDefault();
  const r = canvas.getBoundingClientRect();
  if (e.ctrlKey || e.metaKey) zoomAt(e.clientX - r.left, e.clientY - r.top, cam.k * Math.exp(-e.deltaY * .01));
  else { cam.x -= e.deltaX; cam.y -= e.deltaY; applyCam(); }
}, {passive:false});

let rt = 0;
addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(() => D && fit(currentIds(), false), 150); });

/* ---------- boot ---------- */
function boot(){
  try { if (localStorage.getItem("reviewgraph.panel") === "0") togglePanel(true, false); } catch {}
  if (EMBEDDED) { load(EMBEDDED); return; }
  canvas.insertAdjacentHTML("beforeend", `<div class="empty"><div><p>No review loaded.</p><p>Run <code>reviewgraph</code> on a branch, then open the JSON it writes.</p></div></div>`);
}
(document.fonts ? document.fonts.ready : Promise.resolve()).then(boot);
</script>
